# Builds the Windows app.
#
# The build is ~100 MB, far too big to keep in the repository, so it happens
# here and is attached to the run. Download it from the Actions tab: pick the
# newest run, then "TradeJournal" under Artifacts.
#
# This also has to run on Windows rather than anywhere cheaper: building the
# NSIS installer with an embedded icon needs Wine on Linux, and a real Windows
# runner needs nothing.
#
# Pushing a tag like v0.1.0 also publishes it as a Release, which gives a
# permanent link that does not expire.
name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fails in seconds on a bad build config, rather than after the whole
      # test suite has run. electron-builder rejects unknown keys but will not
      # say which one, so this names it.
      - run: npm run check:build

      # Each build needs a version above the last, or an installed copy has
      # nothing to update to. The run number only ever goes up, so it is the
      # build number. Not committed — it applies to this build's artifacts.
      - name: Number this build
        shell: bash
        run: |
          npm version --no-git-tag-version --allow-same-version "1.0.${{ github.run_number }}"
          echo "Building version 1.0.${{ github.run_number }}"

      # The recorder core is shared with the browser version, so the unit tests
      # guard the app too. A broken build should not ship an .exe.
      - run: npm test

      # --publish never: electron-builder sees CI and would otherwise try to
      # push a GitHub release on every build, which fails without a token and
      # is not what a branch build should do anyway.
      #
      # Signing: electron-builder picks up CSC_LINK and CSC_KEY_PASSWORD from
      # the environment on its own. Add those two repository secrets and every
      # build from then on is signed — no change to any file here. Without
      # them the build is unsigned and Windows shows SmartScreen on first run.
      - run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          # Azure Trusted Signing — the ~$10/month route. electron-builder
          # reads these four itself when build.win.azureSignOptions is set.
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_NAME: ${{ secrets.AZURE_CODE_SIGNING_NAME }}
          AZURE_CERT_PROFILE_NAME: ${{ secrets.AZURE_CERT_PROFILE_NAME }}

      - name: Say whether this build is signed
        shell: bash
        run: |
          if [ -n "${{ secrets.WINDOWS_CERT_BASE64 }}" ] || [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "Signed build — SmartScreen should not warn."
          else
            echo "UNSIGNED build. Windows will show SmartScreen on first run."
            echo "Add the WINDOWS_CERT_BASE64 and WINDOWS_CERT_PASSWORD secrets to fix that."
          fi

      - name: Check the update feed is complete
        shell: bash
        run: |
          set -e
          test -f dist/latest.yml || { echo "latest.yml missing - installed copies cannot find updates"; exit 1; }
          cat dist/latest.yml
          # The filename in latest.yml has to be one we actually upload.
          named=$(grep -E '^\s*(path|url):' dist/latest.yml | head -1 | sed 's/.*: *//' | tr -d '\r')
          test -f "dist/$named" || { echo "latest.yml points at $named, which was not built"; exit 1; }
          grep -q "1.0.${{ github.run_number }}" dist/latest.yml \
            || { echo "latest.yml does not carry this build's version"; exit 1; }
          echo "Update feed OK: $named at 1.0.${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: TradeJournal
          path: |
            dist/TradeJournal-Setup.exe*
            dist/TradeJournal-Portable.exe
            dist/latest.yml
          retention-days: 90
          if-no-files-found: error

      # A GitHub Actions artifact is always delivered as a zip — that is the
      # platform, not a setting. A Release attaches the .exe itself, so the
      # download is the installer rather than a zip containing one.
      #
      # The release is rewritten on every build of this branch, so the download
      # link never changes and always points at the newest app.
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Trade Journal — latest build
          files: |
            dist/TradeJournal-Setup.exe*
            dist/TradeJournal-Portable.exe
            dist/latest.yml
          body: |
            ## Download

            **TradeJournal-Setup.exe** — installer, adds a desktop and Start
            menu shortcut. This is the one you want. Download it once: the app
            updates itself from then on.

            **TradeJournal-Portable.exe** — single file, installs nothing. It
            cannot update itself, so it has to be re-downloaded by hand.

            The installer runs straight through — no options to pick. It
            installs for the current user and opens the app when it is done.

            Build `1.0.${{ github.run_number }}`.

            ### "Windows protected your PC"

            **The button you need is hidden.** The dialog only shows
            *Don't run*, so:

            1. Click **More info** — the small link under the message
            2. Click **Run anyway**, which appears after you do

            Or, before opening it: right-click the downloaded file →
            **Properties** → tick **Unblock** → **OK**.

            You only do this once. Later versions arrive through the app
            itself, and SmartScreen does not check those.

            Windows shows this for any program not signed with a paid
            certificate, whatever is inside it — it is a statement about the
            certificate, not about the file.
            [docs/SIGNING.md](https://github.com/minizivbot/scren-recorder/blob/main/docs/SIGNING.md)
            lists what actually stops it, cheapest first.

      # Assets are added, never replaced, so a rename leaves the old installer
      # beside the new one. Four installers on a download page, half of them
      # stale and unable to update themselves, is how a download starts looking
      # untrustworthy. The logic lives in a script with tests, because the bash
      # version of this step once deleted the entire release.
      - name: Remove installers left over from older builds
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/prune-release-assets.mjs "${{ github.repository }}" latest \
            TradeJournal-Setup.exe \
            TradeJournal-Setup.exe.blockmap \
            TradeJournal-Portable.exe \
            latest.yml

      # Whatever the steps above did, the download has to work when this job
      # ends. This is the last word, and it fails the build if it does not.
      - name: Verify the download page still works
        shell: bash
        run: |
          set -uo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/latest"

          # A freshly uploaded asset can take a few seconds to serve, so a
          # single 404 here would fail a perfectly good build.
          fetchable() {
            for attempt in 1 2 3 4 5; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' -r 0-63 "$1")
              case "$code" in
                200|206) echo "  $1 -> HTTP $code"; return 0 ;;
              esac
              echo "  $1 -> HTTP $code (attempt $attempt)"
              sleep 10
            done
            return 1
          }

          for f in TradeJournal-Setup.exe latest.yml; do
            fetchable "$base/$f" || { echo "$f is not downloadable"; exit 1; }
          done

          curl -sL "$base/latest.yml" | grep -q "1.0.${{ github.run_number }}" \
            || { echo "the published feed is not from this build"; exit 1; }
          echo "Download page OK."

      - name: Report the build size
        shell: bash
        run: ls -lh dist/*.exe
