# Builds the Windows app.
#
# The build is ~100 MB, far too big to keep in the repository, so it happens
# here and is attached to the run. Download it from the Actions tab: pick the
# newest run, then "TradeJournal" under Artifacts.
#
# This also has to run on Windows rather than anywhere cheaper: building the
# NSIS installer with an embedded icon needs Wine on Linux, and a real Windows
# runner needs nothing.
#
# Pushing a tag like v0.1.0 also publishes it as a Release, which gives a
# permanent link that does not expire.
name: Build Windows app

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The recorder core is shared with the browser version, so the unit tests
      # guard the app too. A broken build should not ship an .exe.
      - run: npm test

      # --publish never: electron-builder sees CI and would otherwise try to
      # push a GitHub release on every build, which fails without a token and
      # is not what a branch build should do anyway.
      #
      # Signing: electron-builder picks up CSC_LINK and CSC_KEY_PASSWORD from
      # the environment on its own. Add those two repository secrets and every
      # build from then on is signed — no change to any file here. Without
      # them the build is unsigned and Windows shows SmartScreen on first run.
      - run: npm run dist:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}

      - name: Say whether this build is signed
        shell: bash
        run: |
          if [ -n "${{ secrets.WINDOWS_CERT_BASE64 }}" ]; then
            echo "Signed build — SmartScreen should not warn."
          else
            echo "UNSIGNED build. Windows will show SmartScreen on first run."
            echo "Add the WINDOWS_CERT_BASE64 and WINDOWS_CERT_PASSWORD secrets to fix that."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: TradeJournal
          path: |
            dist/TradeJournal-Setup-*.exe
            dist/TradeJournal-Portable-*.exe
          retention-days: 90
          if-no-files-found: error

      # A GitHub Actions artifact is always delivered as a zip — that is the
      # platform, not a setting. A Release attaches the .exe itself, so the
      # download is the installer rather than a zip containing one.
      #
      # The release is rewritten on every build of this branch, so the download
      # link never changes and always points at the newest app.
      - name: Publish the download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Trade Journal — latest build
          files: |
            dist/TradeJournal-Setup-*.exe
            dist/TradeJournal-Portable-*.exe
          body: |
            ## Download

            **TradeJournal-Setup-1.0.0.exe** — installer, adds a desktop and
            Start menu shortcut. This is the one you want.

            **TradeJournal-Portable-1.0.0.exe** — single file, installs nothing.

            The installer runs straight through — no options to pick. It
            installs for the current user and opens the app when it is done.

            ### "Windows protected your PC"

            Click **More info**, then **Run anyway**. It only asks once per
            machine.

            Windows shows this for any program that is not signed with a paid
            certificate, whatever is inside it. It is a statement about the
            certificate, not about the file. See
            [docs/SIGNING.md](https://github.com/minizivbot/scren-recorder/blob/main/docs/SIGNING.md)
            for how to make it stop.

      - name: Report the build size
        shell: bash
        run: ls -lh dist/*.exe
